# pipelines, MediaMTX paths, the web grid) adapts automatically on restart.
#
#   1 camera listed  -> 1 per-camera stream (cam-0)
#   12 cameras listed -> 12 per-camera streams (cam-0 .. cam-11)
#
# After editing this file, restart the stack:
