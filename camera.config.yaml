# Detection snapshot rules — one entry per camera (or "all").
#   camera:     cam-N name from the list above, or "all" for every camera
#   classes:    class names from the detector's labels.txt
#               (current detector: car, bicycle, person, road_sign)
#               use ["*"] to match any class
#   threshold:  minimum detection confidence (0.0 - 1.0)
#   save_image: true  -> save image to data/<class>/
#               false -> count only, don't save
#   save_mode:  "frame" -> FULL frame with bounding boxes drawn (default)
#               "crop"  -> cropped object region only
#
# A folder is created per class automatically, e.g. data/person/, data/car/

detections:
  - camera: cam-0
    classes: [person]
    threshold: 0.5
    save_image: true
    save_mode: frame

  - camera: cam-1
    classes: [person]
    threshold: 0.5
    save_image: true
    save_mode: crop

  # All cameras, any class, no images (counting only)
  # - camera: all
  #   classes: ["*"]
