<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeepStream Live</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: sans-serif; text-align: center; }
    video { width: 90vw; max-width: 1280px; margin-top: 20px; background: #000; }
  </style>
</head>
<body>
  <h2>Live Inference View (8 cameras)</h2>
  <video id="cam" muted autoplay playsinline controls></video>

  <script>
    // Auto-detect host so the page works from any machine on the LAN.
    // When opened via file:// the hostname is empty, so fall back to localhost.
    const HOST = window.location.hostname || 'localhost';
    const WHEP_URL = `http://${HOST}:8889/ds-test/whep`;

    async function play() {
      const video = document.getElementById('cam');
      const pc = new RTCPeerConnection();
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });
      pc.ontrack = (e) => { video.srcObject = e.streams[0]; };
      pc.onconnectionstatechange = () => console.log('WebRTC:', pc.connectionState);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const resp = await fetch(WHEP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp,
      });
      if (!resp.ok) { console.error('WHEP failed:', resp.status); return; }

      const answer = await resp.text();
      await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    }

    play();
  </script>
</body>
</html>
